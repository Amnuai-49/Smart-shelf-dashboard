      </div>
    </div>

    <div class="page-layout">

      <div class="left-column">

          <div class="mode-switch">
            <button type="button" :class="{ active: plcState.manual }" :aria-pressed="plcState.manual"

            <button type="button" :class="{ active: !plcState.manual }" :aria-pressed="!plcState.manual"

        <!-- COMMAND: กดค้างส่ง true ปล่อยส่ง false (วนจากรายการ COMMAND_BUTTONS) -->
        <div class="card">
          <p class="card-label">COMMAND</p>
          <div class="command-row">
            <button v-for="button in COMMAND_BUTTONS" :key="button.name" type="button"

              @pointerup="releaseCommand(button.name)"
              @pointercancel="releaseCommand(button.name)"
              @lostpointercapture="releaseCommand(button.name)"
              @keydown.space.prevent="pressCommand(button.name)"
              @keydown.enter.prevent="pressCommand(button.name)"
              @keyup.space="releaseCommand(button.name)"
              @keyup.enter="releaseCommand(button.name)"
              @contextmenu.prevent>{{ button.label }}</button>
          </div>
          <p class="address-text">{{ commandAddressText }}</p>

              <span class="unit-text">{{ SETPOINT_CONFIG.unit }}</span>
            </div>

        <!-- STATUS: หลอดไฟสถานะ -->

            <div class="lamp-item" v-for="lamp in statusLamps" :key="lamp.label">
              <span class="lamp-dot" :class="lamp.isOn ? lamp.color : 'off'"></span>{{ lamp.label }}
            </div>
          </div>
        </div>

      </div>

      <!-- ============ คอลัมน์ขวา: Monitoring และ Command log ============ -->
      <div class="right-column">
        <div class="card monitoring-card">

          <div class="monitoring-grid">
            <div class="monitoring-item">
              <span class="monitoring-label">GOOD WP</span>
              <strong class="monitoring-value">{{ formatNumber(plcState.goodWp) }}</strong>
              <span class="address-text">DB1.DBW4 (INT)</span>
            </div>
            <div class="monitoring-item">
              <span class="monitoring-label">NG WP</span>
              <strong class="monitoring-value">{{ formatNumber(plcState.ngWp) }}</strong>
              <span class="address-text">DB1.DBW6 (INT)</span>
            </div>
            <div class="monitoring-item">
              <span class="monitoring-label">WP SET</span>
              <strong class="monitoring-value">{{ formatNumber(plcState.setpoint) }}</strong>
              <span class="address-text">DB1.DBW2 (INT)</span>
            </div>
          </div>
        </div>

        <div class="card log-card">

            <button type="button" class="clear-button" @click="clearCommandLog">CLEAR</button>
          </div>
          <p class="empty-text" v-if="!commandLog.length">ยังไม่มีเหตุการณ์ใน Command Log</p>
          <div class="log-row" v-for="entry in commandLog" :key="entry.id">
            <span class="time-text">{{ formatLogTime(entry) }}</span>
            <span>{{ entry.message }} <span class="address-text address-inline">{{ entry.address }}</span></span>
            <span class="tag" :class="'tag-' + entry.color">{{ entry.label }}</span>
          </div>
        </div>
      </div>

    </div>

</template>

<script>
/*
  CONTROL PANEL  ·  Dashboard 2.0 ui-template
  - ค่าที่แก้บ่อยอยู่ที่ CONFIG ใน data() ด้านล่าง (ช่วงค่า, หน่วย, address ที่แสดง)
  - ส่วนหน้าตา = บล็อก template | การทำงาน = บล็อก script นี้ | สี/การจัดวาง = บล็อก style

  ตัวแปรหลัก:
    plcState       สถานะที่อ่านมาจาก PLC (manual, running, fault, setpoint, plcConnected)
    commandLog     รายการเหตุการณ์ใน Command Log (RUN / STOP / FAULT และการส่ง Setpoint)
    setpointInput  ตัวเลขที่ผู้ใช้พิมพ์ในช่อง Setpoint
    heldButtons    บอกว่าปุ่มคำสั่งไหนกำลังถูกกดค้างอยู่
*/
export default {
  data() {
    // ==================== CONFIG (แก้ตรงนี้) ====================
    // address ในรายการนี้ใช้ "แสดงบนหน้าจอ" เท่านั้น
    // ตัวที่ส่งค่าไป PLC จริงตั้งที่ s7 endpoint ใน Node-RED
    const SETPOINT_CONFIG = { min: 0, max: 100, unit: '%', address: 'DB1.DBW2' }

    const COMMAND_BUTTONS = [
      { name: 'start', label: 'START', address: 'DB1.DBX0.0' },
      { name: 'stop',  label: 'STOP',  address: 'DB1.DBX0.1' },
      { name: 'reset', label: 'RESET', address: 'DB1.DBX0.5' }
    ]
    // =============================================================

    return {
      SETPOINT_CONFIG,
      COMMAND_BUTTONS,

      // ---- นาฬิกา ----
      clockText: '',
      clockTimer: null,

      // ---- ปุ่มและช่องกรอก ----
      setpointInput: 0,                                                       // ค่าในช่อง Setpoint
      heldButtons: Object.fromEntries(COMMAND_BUTTONS.map(b => [b.name, false])), // ปุ่มไหนถูกกดค้างอยู่

      // ---- ข้อมูลจาก PLC / Node-RED ----
      commandLog: [],
      plcState: {
        manual: false,
        running: false,
        fault: false,
        setpoint: null,
        goodWp: null,
        ngWp: null,
        plcConnected: false
      }
    }
  },

  // ==================== ค่าที่คำนวณ ====================
  computed: {
    // Setpoint ต้องเป็นจำนวนเต็มในช่วงที่กำหนด
    isSetpointValid() {
      if (this.setpointInput === '' || this.setpointInput === null) return false
      const value = Number(this.setpointInput)
      return Number.isInteger(value) && value >= this.SETPOINT_CONFIG.min && value <= this.SETPOINT_CONFIG.max
    },

    // ป้ายสถานะมุมขวาบน เช่น "MANUAL · RUNNING"
    statusBadge() {
      const modeName = this.plcState.manual ? 'MANUAL' : 'AUTO'
      if (this.plcState.fault) return { cssClass: 'tag-amber', text: modeName + ' · FAULT' }
      return this.plcState.running
        ? { cssClass: 'tag-green', text: modeName + ' · RUNNING' }
        : { cssClass: 'tag-red', text: modeName + ' · STOPPED' }
    },

    // หลอดไฟ: isOn = เงื่อนไขที่ทำให้ติด, color = สีตอนติด (green / red / amber)
    statusLamps() {
      const state = this.plcState
      return [
        { label: 'RUN',      isOn: state.running,      color: 'green' },
        { label: 'STOP',     isOn: !state.running,     color: 'red' },
        { label: 'MANUAL',   isOn: state.manual,       color: 'amber' },
        { label: 'AUTO',     isOn: !state.manual,      color: 'amber' },
        { label: 'FAULT',    isOn: state.fault,        color: 'red' },
        { label: 'PLC LINK', isOn: state.plcConnected, color: 'green' }
      ]
    },

    // ข้อความ address ใต้ปุ่มคำสั่ง
    commandAddressText() {
      return this.COMMAND_BUTTONS.map(b => b.label + ' → ' + b.address).join(' · ')
    }
  },

  // ==================== รับข้อมูลเข้า ====================
  watch: {
    msg(message) { this.applyMessage(message) }
  },

  // ==================== วงจรชีวิตของหน้า ====================
  mounted() {
    // เปิดหน้าใหม่ (เช่น สลับหน้ากลับมา) ใช้ค่าล่าสุดที่ค้างอยู่ทันที
    if (this.msg) this.applyMessage(this.msg)

    // นาฬิกาเดินทุกวินาที
    const updateClock = () => { this.clockText = new Date().toLocaleString('th-TH', { hourCycle: 'h23' }) }
    updateClock()
    this.clockTimer = setInterval(updateClock, 1000)

    // ถ้าหน้าหลุดโฟกัสขณะกดค้าง ให้ปล่อยปุ่มเอง (กันค่า true ค้างใน PLC)
    window.addEventListener('blur', this.releaseAllCommands)
    document.addEventListener('visibilitychange', this.releaseAllCommands)
  },
  beforeUnmount() {
    clearInterval(this.clockTimer)
    window.removeEventListener('blur', this.releaseAllCommands)
    document.removeEventListener('visibilitychange', this.releaseAllCommands)
    this.releaseAllCommands()
  },

  // ==================== ฟังก์ชัน ====================
  methods: {
    // ---------- รับข้อมูล ----------
    // รับสถานะและ log ที่ Node-RED ส่งมา (payload เป็น object รวมทุกค่า)
    applyMessage(message) {
      if (!message) return
      const payload = message.payload
      if (payload && typeof payload === 'object' && !Array.isArray(payload)) {
        const { commandLog, ...plcValues } = payload
        if (Array.isArray(commandLog)) this.commandLog = commandLog
        Object.assign(this.plcState, plcValues)
      } else if (typeof message.topic === 'string' && message.topic in this.plcState) {
        this.plcState[message.topic] = payload          // กรณีส่งมาทีละค่า
      }
    },

    // ---------- ส่งคำสั่งไป PLC ----------
    // กดปุ่ม: ส่ง true (ทำงานครั้งเดียวต่อการกดหนึ่งครั้ง)
    pressCommand(commandName, event) {
      if (this.heldButtons[commandName]) return
      if (event && event.currentTarget && event.pointerId !== undefined) {
        // จับ pointer ไว้ เพื่อให้ได้ event "ปล่อย" แม้ลากเมาส์/นิ้วออกนอกปุ่ม
        try { event.currentTarget.setPointerCapture(event.pointerId) } catch (error) {}
      }
      this.heldButtons[commandName] = true
      this.send({ topic: commandName, payload: true })
    },
    // ปล่อยปุ่ม: ส่ง false
    releaseCommand(commandName) {
      if (!this.heldButtons[commandName]) return
      this.heldButtons[commandName] = false
      this.send({ topic: commandName, payload: false })
    },
    // ปล่อยทุกปุ่มที่ค้างอยู่
    releaseAllCommands() {
      this.COMMAND_BUTTONS.forEach(button => this.releaseCommand(button.name))
    },
    // สลับโหมด Manual (true) / Auto (false)
    setManualMode(isManual) {
      this.plcState.manual = isManual
      this.send({ topic: 'set_manual_mode', payload: isManual })
    },
    // ส่งค่า Setpoint (เฉพาะเมื่อค่าถูกต้อง)
    sendSetpoint() {
      if (!this.isSetpointValid) return
      const setpointValue = Number(this.setpointInput)
      this.send({ topic: 'setpoint', payload: setpointValue })

      // บันทึกลง Command Log (Node-RED เป็นคนเก็บและส่งรายการกลับมาแสดง)
      const now = Date.now()
      this.send({ topic: 'add_command_log', payload: {
        id: now + '-setpoint',
        timestamp: now,
        label: 'SETPOINT',
        color: 'green',
        message: 'Setpoint sent ' + setpointValue,
        address: this.SETPOINT_CONFIG.address
        } 
      })

      this.setpointInput = 0
    },

    // ---------- Command log ----------
    clearCommandLog() {
      this.send({ topic: 'clear_command_log' })
    },
    // เวลาของแถว log (Node-RED บันทึกเป็น timestamp)
    formatLogTime(entry) {
      return new Date(entry.timestamp).toLocaleTimeString('th-TH', { hourCycle: 'h23' })
    },

    // ---------- ตัวช่วยแสดงผล ----------
    formatNumber(value) {
      return typeof value === 'number' ? String(value) : '--'
    }
  }
}
</script>
