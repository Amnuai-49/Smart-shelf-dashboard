<template>
  <div class="io-page">

    <!-- ============ HEADER ============ -->
    <div class="page-header">
      <span class="page-title">IO Status</span>
      <div class="header-right">
        <span class="clock-text">{{ clockText }}</span>
        <span class="tag" :class="statusBadge.cssClass">{{ statusBadge.text }}</span>
      </div>
    </div>

    <!-- แถบแดง: แสดง error ที่ได้จาก PLC (ถ้ามี) -->
    <div class="error-bar" v-if="plcState.errorText">PLC ERROR · {{ plcState.errorText }}</div>

    <div class="columns">

      <!-- ============ INPUTS (ซ้าย): แสดงสถานะอย่างเดียว ============ -->
      <div class="card">
        <div class="card-header">
          <p class="card-label">INPUTS · I0.0 – I1.5</p>
          <span class="count-text"><b>{{ inputsOnCount }}</b> / {{ inputPoints.length }} ON</span>
        </div>
        <div class="point-grid" :style="{ '--rows': Math.ceil(inputPoints.length / 2) }">
          <div class="point-tile" v-for="point in inputPoints" :key="point.address">
            <span class="lamp-dot" :class="point.isOn ? 'green' : 'off'"></span>
            <span class="point-address">{{ point.address }}</span>
            <span class="point-name">{{ point.name }}</span>
            <span class="state-pill" :class="point.isOn ? 'on' : 'off'">{{ point.isOn ? 'ON' : 'OFF' }}</span>
          </div>
        </div>
      </div>

      <!-- ============ OUTPUTS (ขวา): กดเพื่อสั่ง ON/OFF ได้ในโหมด MANUAL ============ -->
      <div class="card">
        <div class="card-header">
          <p class="card-label">OUTPUTS · Q0.0 – Q1.1</p>
          <span class="count-text"><b>{{ outputsOnCount }}</b> / {{ outputPoints.length }} ON</span>
        </div>
        <p class="hint-text" :class="{ warning: outputHint.isWarning }">{{ outputHint.text }}</p>
        <div class="point-grid" :style="{ '--rows': Math.ceil(outputPoints.length / 2) }">
          <button type="button" class="point-tile point-button"
            v-for="(point, outputIndex) in outputPoints" :key="point.address"
            :disabled="!canCommandOutputs" :aria-pressed="point.isOn" @click="toggleOutput(outputIndex)">
            <span class="lamp-dot" :class="point.isOn ? 'amber' : 'off'"></span>
            <span class="point-address">{{ point.address }}</span>
            <span class="point-name">{{ point.name }}</span>
            <span class="state-pill" :class="point.isOn ? 'on' : 'off'">{{ point.isOn ? 'ON' : 'OFF' }}</span>
          </button>
        </div>
      </div>

    </div>

    <!-- บรรทัดตรวจสอบ: ค่าดิบที่ Node-RED อ่านได้จาก PLC (ลบบรรทัดนี้ได้เมื่อใช้งานปกติแล้ว) -->
    <!--<div class="raw-text">RAW · {{ rawValuesText }}</div> -->
  </div>
</template>

<script>
/*
  IO STATUS  ·  Dashboard 2.0 ui-template
  - ตั้งชื่อแต่ละจุดที่ CONFIG ใน data() ด้านล่าง
  - Input แสดงสถานะ | Output กดสั่งได้เมื่อ PLC อยู่โหมด MANUAL

  ตัวแปรหลัก:
    plcState.inputBits / outputBits   อาร์เรย์ true/false ของแต่ละจุด (ตัวแรกคือ I0.0 / Q0.0)
    plcState.hasPlcData               true เมื่อเคยได้ข้อมูลจริงจาก PLC แล้ว
    plcState.rawValues                ค่าดิบที่อ่านได้ (ใช้ตรวจสอบปัญหา)
    inputPoints / outputPoints        รายการจุด (address + ชื่อ + ติดหรือดับ) สำหรับแสดงผล
*/
export default {
  data() {
    return {
      // ==================== CONFIG (แก้ตรงนี้) ====================
      // ชื่อเรียงตามลำดับ I0.0, I0.1, ... I0.7, I1.0, ... (ตัวแรกคือ I0.0)
      INPUT_NAMES: [
        'DI 00', 'DI 01', 'DI 02', 'DI 03', 'DI 04', 'DI 05', 'DI 06',
        'DI 07', 'DI 08', 'DI 09', 'DI 10', 'DI 11', 'DI 12', 'DI 13'
      ],
      // ชื่อเรียงตามลำดับ Q0.0, Q0.1, ... Q0.7, Q1.0, ...
      OUTPUT_NAMES: [
        'DO 00', 'DO 01', 'DO 02', 'DO 03', 'DO 04',
        'DO 05', 'DO 06', 'DO 07', 'DO 08', 'DO 09'
      ],
      // =============================================================

      // ---- นาฬิกา ----
      clockText: '',
      clockTimer: null,

      // ---- ข้อมูลจาก PLC / Node-RED ----
      plcState: {
        inputBits: [], outputBits: [],
        manual: false, running: false, fault: false,
        hasPlcData: false, errorText: '', rawValues: {}
      }
    }
  },

  // ==================== ค่าที่คำนวณ ====================
  computed: {
    // ---------- รายการจุด Input / Output (ชื่อ + address + สถานะ) ----------
    inputPoints() {
      return this.INPUT_NAMES.map((name, bitNumber) => ({
        address: 'I' + (bitNumber >> 3) + '.' + (bitNumber & 7),
        name,
        isOn: !!this.plcState.inputBits[bitNumber]
      }))
    },
    outputPoints() {
      return this.OUTPUT_NAMES.map((name, bitNumber) => ({
        address: 'Q' + (bitNumber >> 3) + '.' + (bitNumber & 7),
        name,
        isOn: !!this.plcState.outputBits[bitNumber]
      }))
    },
    inputsOnCount()  { return this.inputPoints.filter(point => point.isOn).length },
    outputsOnCount() { return this.outputPoints.filter(point => point.isOn).length },

    // ---------- ป้ายสถานะมุมขวาบน ----------
    // ถ้ายังไม่ได้ข้อมูลจาก PLC จะไม่แสดง AUTO หลอกๆ
    statusBadge() {
      if (!this.plcState.hasPlcData) return { cssClass: 'tag-gray', text: 'NO DATA FROM PLC' }
      const modeName = this.plcState.manual ? 'MANUAL' : 'AUTO'
      if (this.plcState.fault) return { cssClass: 'tag-amber', text: modeName + ' · FAULT' }
      return this.plcState.running
        ? { cssClass: 'tag-green', text: modeName + ' · RUNNING' }
        : { cssClass: 'tag-red', text: modeName + ' · STOPPED' }
    },

    // ---------- สิทธิ์สั่ง Output ----------
    // สั่งได้ต่อเมื่อได้ข้อมูลจาก PLC แล้ว และอยู่โหมด MANUAL
    canCommandOutputs() {
      return this.plcState.hasPlcData && this.plcState.manual
    },

    // ข้อความใต้หัวการ์ด Output บอกสถานะ/เหตุผลที่กดไม่ได้
    outputHint() {
      if (!this.plcState.hasPlcData) {
        return { isWarning: true, text: 'ยังไม่ได้รับข้อมูลจาก PLC · ตรวจ IP, PUT/GET และข้อความ error ด้านบน' }
      }
      if (!this.canCommandOutputs) {
        return { isWarning: true, text: 'AUTO · สั่ง Output ไม่ได้ สลับเป็น MANUAL ที่หน้า Control ก่อน' }
      }
      return { isWarning: false, text: 'MANUAL · กดที่จุดเพื่อสั่ง ON / OFF' }
    },

    // ---------- บรรทัดค่าดิบ ----------
    rawValuesText() {
      const rawValues = this.plcState.rawValues || {}
      return Object.keys(rawValues).length
        ? JSON.stringify(rawValues)
        : 'ไม่มีข้อมูลดิบ (s7 in ยังไม่ส่งค่ามา)'
    }
  },

  // ==================== รับข้อมูลเข้า ====================
  watch: {
    msg(message) { this.applyMessage(message) }
  },

  // ==================== วงจรชีวิตของหน้า ====================
  mounted() {
    // เปิดหน้าใหม่ (เช่น สลับหน้ากลับมา) ใช้ค่าล่าสุดที่ค้างอยู่ทันที
    if (this.msg) this.applyMessage(this.msg)

    // นาฬิกาเดินทุกวินาที
    const updateClock = () => { this.clockText = new Date().toLocaleString('th-TH', { hourCycle: 'h23' }) }
    updateClock()
    this.clockTimer = setInterval(updateClock, 1000)
  },
  beforeUnmount() {
    clearInterval(this.clockTimer)
  },

  // ==================== ฟังก์ชัน ====================
  methods: {
    // รับสถานะที่ Node-RED ส่งมา (payload เป็น object รวมทุกค่า) แล้วเก็บเข้า plcState
    applyMessage(message) {
      const payload = message && message.payload
      if (!payload || typeof payload !== 'object') return

      if (Array.isArray(payload.inputBits)) {
        this.plcState.inputBits = payload.inputBits
        this.plcState.hasPlcData = true                 // ได้ข้อมูลจริงแล้ว
      }
      if (Array.isArray(payload.outputBits))        this.plcState.outputBits = payload.outputBits
      if (typeof payload.manual === 'boolean')      this.plcState.manual = payload.manual
      if (typeof payload.running === 'boolean')     this.plcState.running = payload.running
      if (typeof payload.fault === 'boolean')       this.plcState.fault = payload.fault
      if (typeof payload.errorText === 'string')    this.plcState.errorText = payload.errorText
      if (payload.rawValues && typeof payload.rawValues === 'object') this.plcState.rawValues = payload.rawValues
    },

    // กดจุด Output: ส่งค่าตรงข้ามกับสถานะปัจจุบัน (topic เช่น output_q0_0, output_q0_1, ... output_q1_1)
    // flow ฝั่งเซิร์ฟเวอร์ตรวจโหมด MANUAL ซ้ำอีกชั้นก่อนเขียนลง PLC
    toggleOutput(outputIndex) {
      if (!this.canCommandOutputs) return
      const topic = 'output_q' + (outputIndex >> 3) + '_' + (outputIndex & 7)
      this.send({ topic, payload: !this.outputPoints[outputIndex].isOn })
    }
  }
}
</script>
